## name:     Gruvbox Material Cool Aqua
## blurb:    Custom cool-toned Gruvbox tuned for #7daea3 foreground and #1d2021 background

# The basic colors
foreground            #7daea3
background            #1d2021
selection_foreground  #1d2021
selection_background  #3c3836

# Cursor colors
cursor                #7daea3
cursor_text_color     #1d2021

# URL underline color when hovering with mouse
url_color             #89b482

# Kitty window border colors
active_border_color   #7daea3
inactive_border_color #3c3836
bell_border_color     #d8a657

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color   system

# Tab bar colors
active_tab_foreground   #1d2021
active_tab_background   #7daea3
inactive_tab_foreground #89b482
inactive_tab_background #282828
tab_bar_background      #1d2021

# Colors for marks (marked text in the terminal)
mark1_foreground #1d2021
mark1_background #7daea3
mark2_foreground #1d2021
mark2_background #b16286
mark3_foreground #1d2021
mark3_background #89b482

# The 16 terminal colors

# black (backgrounds / muted element overlays)
color0 #1d2021
color8 #504945

# red (muted coral / soft pink instead of harsh orange-red)
color1 #ea6962
color9 #d3869b

# green (sage / desaturated olive)
color2  #89b482
color10 #a9b665

# yellow (soft sand / cream - removes harsh bright orange/yellow)
color3  #d5c4a1
color11 #e0d0b0

# blue (primary aqua accent)
color4  #7daea3
color12 #89b482

# magenta (cool lavender / violet)
color5  #b16286
color13 #d3869b

# cyan (deep teal / ice blue)
color6  #689d6a
color14 #7daea3

# white (soft muted white for secondary text)
color7  #a89984
color15 #d4be98
